name: APK
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor ile Android projesi oluştur
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          npm install --no-audit --no-fund
          npm run www
          sed -i "s/__OWNER__/${{ github.repository_owner }}/g" capacitor.config.json www/version.json
          npx cap add android
          npx cap sync android
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ondalik-kutular.apk
      - name: Sürümü oku
        id: ver
        run: echo "tag=v$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          files: ondalik-kutular.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
